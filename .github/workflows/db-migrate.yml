name: Run Database Migrations

on:
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest

    steps:
      - name: Setup SSH Key
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
        run: |
          # Safe sanity checks (does not leak the secret key content)
          echo "=== SECRETS CONFIGURATION DIAGNOSTICS ==="
          
          # Check SSH_KEY
          if [ -z "$SSH_KEY" ]; then
            echo "[-] SSH_KEY: MISSING"
            exit_flag=1
          else
            echo "[+] SSH_KEY: PRESENT"
            FIRST_LINE=$(echo "$SSH_KEY" | head -n 1)
            echo "    Header detected: '${FIRST_LINE:0:30}...'"
            if [[ ! "$FIRST_LINE" =~ ^-----BEGIN ]]; then
              echo "    ERROR: SSH_KEY does not start with standard private key header (-----BEGIN)."
              echo "    Please verify you copied the PRIVATE key, not the public key (.pub)."
              exit_flag=1
            fi
          fi

          # Check PORT
          if [ -z "${{ secrets.PORT }}" ]; then
            echo "[-] PORT: MISSING"
            exit_flag=1
          else
            echo "[+] PORT: PRESENT"
          fi

          # Check HOST
          if [ -z "${{ secrets.HOST }}" ]; then
            echo "[-] HOST: MISSING"
            exit_flag=1
          else
            echo "[+] HOST: PRESENT"
          fi

          # Check USERNAME
          if [ -z "${{ secrets.USERNAME }}" ]; then
            echo "[-] USERNAME: MISSING"
            exit_flag=1
          else
            echo "[+] USERNAME: PRESENT"
          fi

          # Check TARGET_DIR
          if [ -z "${{ secrets.TARGET_DIR }}" ]; then
            echo "[-] TARGET_DIR: MISSING"
            exit_flag=1
          else
            echo "[+] TARGET_DIR: PRESENT"
          fi

          echo "========================================="

          if [ "$exit_flag" = "1" ]; then
            echo "ERROR: One or more configuration secrets are missing or invalid. Migration aborted."
            exit 1
          fi

          mkdir -p ~/.ssh
          echo "$SSH_KEY" | tr -d '\r' > ~/.ssh/id_ed25519
          echo "" >> ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      - name: Execute Migration Remote Command
        run: |
          echo "Connecting to server to run migrations..."
          ssh -p ${{ secrets.PORT }} -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=15 -o ConnectionAttempts=5 ${{ secrets.USERNAME }}@${{ secrets.HOST }} "cd ~/${{ secrets.TARGET_DIR }} && echo '=== MIGRATION STATUS BEFORE ===' && php spark migrate:status && echo '=== RUNNING MIGRATIONS ===' && php spark migrate -f && echo '=== MIGRATION STATUS AFTER ===' && php spark migrate:status"
