name: Deploy to MilesWeb

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl, json, xml, curl
          coverage: none

      - name: Install Composer Dependencies
        run: composer install --no-dev --optimize-autoloader

      - name: Generate .env File
        run: |
          cat <<EOF > .env
          CI_ENVIRONMENT = production
          database.default.hostname = "${{ secrets.DB_HOST }}"
          database.default.database = "${{ secrets.DB_NAME }}"
          database.default.username = "${{ secrets.DB_USER }}"
          database.default.password = "${{ secrets.DB_PASS }}"
          database.default.DBDriver = MySQLi
          EOF

      - name: Setup SSH
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
        run: |
          # Safe sanity checks (does not leak the secret key content)
          echo "=== SECRETS CONFIGURATION DIAGNOSTICS ==="
          
          # Check SSH_KEY
          if [ -z "$SSH_KEY" ]; then
            echo "[-] SSH_KEY: MISSING"
            exit_flag=1
          else
            echo "[+] SSH_KEY: PRESENT"
            FIRST_LINE=$(echo "$SSH_KEY" | head -n 1)
            echo "    Header detected: '${FIRST_LINE:0:30}...'"
            if [[ ! "$FIRST_LINE" =~ ^-----BEGIN ]]; then
              echo "    ERROR: SSH_KEY does not start with standard private key header (-----BEGIN)."
              echo "    Please verify you copied the PRIVATE key, not the public key (.pub)."
              exit_flag=1
            fi
          fi

          # Check PORT
          if [ -z "${{ secrets.PORT }}" ]; then
            echo "[-] PORT: MISSING"
            exit_flag=1
          else
            echo "[+] PORT: PRESENT"
          fi

          # Check HOST
          if [ -z "${{ secrets.HOST }}" ]; then
            echo "[-] HOST: MISSING"
            exit_flag=1
          else
            echo "[+] HOST: PRESENT"
          fi

          # Check USERNAME
          if [ -z "${{ secrets.USERNAME }}" ]; then
            echo "[-] USERNAME: MISSING"
            exit_flag=1
          else
            echo "[+] USERNAME: PRESENT"
          fi

          # Check TARGET_DIR
          if [ -z "${{ secrets.TARGET_DIR }}" ]; then
            echo "[-] TARGET_DIR: MISSING"
            exit_flag=1
          else
            echo "[+] TARGET_DIR: PRESENT"
          fi

          echo "========================================="

          if [ "$exit_flag" = "1" ]; then
            echo "ERROR: One or more configuration secrets are missing or invalid. Deployment aborted."
            exit 1
          fi

          mkdir -p ~/.ssh
          echo "$SSH_KEY" | tr -d '\r' > ~/.ssh/id_ed25519
          echo "" >> ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      - name: Deploy Files
        run: |
          rsync -avz --delete \
            -e "ssh -p ${{ secrets.PORT }} -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null" \
            ./ \
            ${{ secrets.USERNAME }}@${{ secrets.HOST }}:~/${{ secrets.TARGET_DIR }}

      - name: Run Database Migrations
        run: |
          echo "Connecting to server to run migrations..."
          ssh -p ${{ secrets.PORT }} -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null ${{ secrets.USERNAME }}@${{ secrets.HOST }} "cd ~/${{ secrets.TARGET_DIR }} && php spark migrate -f"
