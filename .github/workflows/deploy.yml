name: Deploy to MilesWeb

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl, json, xml, curl
          coverage: none

      - name: Install Composer Dependencies
        run: composer install --no-dev --optimize-autoloader

      - name: Setup SSH
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
        run: |
          # Safe sanity checks (does not leak the secret key content)
          if [ -z "$SSH_KEY" ]; then
            echo "::error::SSH_KEY secret is empty. Please set it in GitHub repository Secrets."
            exit 1
          fi

          FIRST_LINE=$(echo "$SSH_KEY" | head -n 1)
          if [[ ! "$FIRST_LINE" =~ ^-----BEGIN ]]; then
            echo "::error::SSH_KEY does not start with standard private key header (e.g. -----BEGIN). You might have pasted a public key (e.g. ssh-rsa or ssh-ed25519) instead of a private key. Your secret's first line starts with: '${FIRST_LINE:0:25}'"
            exit 1
          fi

          mkdir -p ~/.ssh
          echo "$SSH_KEY" | tr -d '\r' > ~/.ssh/id_ed25519
          echo "" >> ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p ${{ secrets.PORT }} ${{ secrets.HOST }} >> ~/.ssh/known_hosts

      - name: Deploy Files
        run: |
          rsync -avz --delete \
            -e "ssh -p ${{ secrets.PORT }}" \
            ./ \
            ${{ secrets.USERNAME }}@${{ secrets.HOST }}:~/${{ secrets.TARGET_DIR }}
